name: probe-591

# 驗證 GitHub Actions 執行環境能否正常存取 591 BFF API。
# 依 ARCHITECTURE「排程資料源驗證」:接入前必須用與正式環境相同的環境實測。
on:
  push:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          URL="https://bff-house.591.com.tw/v3/web/rent/list?regionid=1&sectionid=9&rentprice=20000_25000&timestamp=$(date +%s)000"

          echo "=== A) curl 預設 UA ==="
          code=$(curl -s -o /tmp/a.json -w '%{http_code}' "$URL")
          echo "HTTP $code"

          sleep 2
          echo "=== B) 誠實自我標示 UA ==="
          code=$(curl -s -o /tmp/b.json -w '%{http_code}' -A 'rent_notice_bot/1.0' "$URL")
          echo "HTTP $code"
          if [ "$code" = "200" ]; then
            echo "total  = $(jq -r '.data.total' /tmp/b.json)"
            echo "items  = $(jq -r '.data.items | length' /tmp/b.json)"
            echo "first  = $(jq -r '.data.items[0] | "\(.id) | \(.address) | \(.price) \(.price_unit)"' /tmp/b.json)"
          else
            echo "--- 回應前 200 字 ---"
            head -c 200 /tmp/b.json || true
            echo
          fi

          sleep 2
          echo "=== C) 對照組:GAS 的 UA(預期 403) ==="
          code=$(curl -s -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0 (compatible; Google-Apps-Script; beanserver; +https://script.google.com; id: TEST)' "$URL")
          echo "HTTP $code"

          echo "=== 執行環境 ==="
          curl -s https://ipinfo.io/org || true
