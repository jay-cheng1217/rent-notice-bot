name: fetch-591

# 依 config/filters.json 抓 591,結果寫入 data/listings.json 供 GAS 讀取。
#
# 為何在 GitHub Actions 抓:591 以 UA 字串封鎖 Google Apps Script,而 GAS 無法
# 覆寫 UA(Google 限制)。本環境用 curl 預設 UA 即可,**不需任何繞過機制**。
#
# 排程策略:GitHub 的 cron 常延遲或跳過(實測 4 小時只觸發 1 次),故主要由 GAS
# 每 15 分鐘以 workflow_dispatch 準時觸發;下方 cron 僅作為備援。
#
# 間歇性 403:591 會對資料中心流量偶發限流(實測約 6 成成功)。對策為重試 +
# 失敗時保留上一份好資料 —— 物件會在站上停留數日,晚一輪抓到不會漏,只會延遲。

on:
  schedule:
    - cron: '*/30 * * * *'     # 備援;主要觸發來自 GAS
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-591
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 抓取 591
        run: |
          set -uo pipefail
          PAGE_SIZE=30          # 591 每頁固定 30 筆
          MAX_PAGES=5           # 上限 150 筆/查詢;超出會在 log 明確標示,不靜默截斷
          mkdir -p data
          [ -f data/listings.json ] || echo '{"results":{}}' > data/listings.json
          if [ ! -f config/filters.json ]; then
            echo "尚無 config/filters.json,略過"; exit 0
          fi

          PREV=data/listings.json
          echo '{"generated_at":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'","results":{},"stale":{}}' > /tmp/out.json

          jq -c '.queries[]' config/filters.json | while read -r q; do
            sig=$(echo "$q"     | jq -r '.sig')
            region=$(echo "$q"  | jq -r '.region_id')
            # section_id 可為多區(如 "1,9")、"0" 或空字串(= 整個縣市不指定)
            section=$(echo "$q" | jq -r '.section_id // "" | tostring')
            [ "$section" = "0" ] && section=""
            kind=$(echo "$q"    | jq -r '.kind_id // 0')
            price=$(echo "$q"   | jq -r '.price // ""')

            # 逐頁抓完整清單。只抓第一頁會讓基準不完整:未被涵蓋的舊物件
            # 一旦被房東刷新擠進前 30 名,就會被誤判為「新上架」而誤推。
            ok=1
            page=0
            echo '[]' > /tmp/acc.json
            while [ "$page" -lt "$MAX_PAGES" ]; do
              first=$((page * PAGE_SIZE))
              got=0
              # 最多 3 次,間隔遞增;重試針對的是暫時性限流
              for attempt in 1 2 3; do
                url="https://bff-house.591.com.tw/v3/web/rent/list?regionid=${region}&timestamp=$(date +%s)000"
                [ -n "$section" ]  && url="${url}&sectionid=${section}"
                [ "$kind" != "0" ] && url="${url}&kind=${kind}"
                [ -n "$price" ]    && url="${url}&rentprice=${price}"
                [ "$first" != "0" ] && url="${url}&firstRow=${first}"

                code=$(curl -s -o /tmp/resp.json -w '%{http_code}' --max-time 30 "$url" || echo 000)
                echo "query ${sig} 第 $((page+1)) 頁 第 ${attempt} 次 -> HTTP ${code}"
                if [ "$code" = "200" ] && jq -e '.data.items' /tmp/resp.json >/dev/null 2>&1; then
                  got=1; break
                fi
                [ "$attempt" != "3" ] && sleep $((attempt * 20))
              done

              if [ "$got" != "1" ]; then ok=0; break; fi

              jq '[ (.data.items // [])[] | {
                    id: (.id|tostring), title: .title, price: .price,
                    price_unit: .price_unit, kind_name: .kind_name,
                    address: .address, area_name: .area_name,
                    floor_name: .floor_name, layout: .layoutStr,
                    refresh_time: .refresh_time,
                    photos: ((.photoList // []) as $p
                             | (if ($p | map(select(test("/house/"))) | length) > 0
                                then ($p | map(select(test("/house/"))))
                                else $p end)
                             | .[0:6]),
                    url: (.url // ("https://rent.591.com.tw/" + (.id|tostring)))
                  } ]' /tmp/resp.json > /tmp/page.json
              jq -s 'add | unique_by(.id)' /tmp/acc.json /tmp/page.json > /tmp/acc2.json && mv /tmp/acc2.json /tmp/acc.json

              cnt=$(jq 'length' /tmp/page.json)
              total=$(jq -r '.data.total // 0' /tmp/resp.json)
              [ "$cnt" -lt "$PAGE_SIZE" ] && break
              page=$((page + 1))
              # 未抓完就達到頁數上限時明確記錄,不靜默截斷
              if [ "$page" -ge "$MAX_PAGES" ]; then
                echo "⚠️ query ${sig} 達頁數上限 ${MAX_PAGES}(共 ${total} 筆),其餘未納入"
              fi
              sleep 3
            done

            if [ "$ok" = "1" ]; then
              echo "query ${sig} 共取得 $(jq 'length' /tmp/acc.json) 筆"
              jq --arg sig "$sig" --slurpfile acc /tmp/acc.json \
                '.results[$sig] = $acc[0]' /tmp/out.json > /tmp/o2.json && mv /tmp/o2.json /tmp/out.json
            else
              # 失敗:沿用上一份好資料並標記為 stale,絕不用空資料覆寫
              echo "query ${sig} 三次皆失敗,沿用前次資料"
              jq --arg sig "$sig" --slurpfile prev "$PREV" '
                .results[$sig] = ($prev[0].results[$sig] // [])
                | .stale[$sig] = true
              ' /tmp/out.json > /tmp/o2.json && mv /tmp/o2.json /tmp/out.json
            fi
            sleep 3
          done

          mv /tmp/out.json data/listings.json
          echo "--- 摘要 ---"
          jq '{generated_at, counts: (.results|map_values(length)), stale}' data/listings.json

      - name: 提交結果
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/listings.json
          if git diff --staged --quiet; then
            echo "無變動"
          else
            git commit -m "data: 更新 591 物件快照 [skip ci]"
            git push
          fi
